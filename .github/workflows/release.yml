name: Build and Release Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión del paquete a compilar (ej: 1.0.1)'
        required: false
        default: '1.0.1'

permissions:
  contents: write

jobs:
  build:
    name: Build .deb and .tar.gz
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.20'
          cache: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev

      - name: Determine Version
        id: get_version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            CLEAN_VER="${{ github.event.inputs.version }}"
          elif [[ "$GITHUB_REF" =~ refs/tags/v?(.*) ]]; then
            CLEAN_VER="${BASH_REMATCH[1]}"
          else
            CLEAN_VER="1.0.1"
          fi
          # Remover 'v' inicial si viene presente
          CLEAN_VER="${CLEAN_VER#v}"
          echo "VERSION=$CLEAN_VER" >> $GITHUB_ENV
          echo "Building package version: $CLEAN_VER"

      - name: Build Packages (.deb and .tar.gz)
        run: |
          bash packaging/build-deb.sh "$VERSION"

      - name: Generate Checksums
        run: |
          sha256sum *.deb *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Artifacts to Workflow
        uses: actions/upload-artifact@v4
        with:
          name: hikvision-sadp-packages
          path: |
            *.deb
            *.tar.gz
            SHA256SUMS.txt

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.deb
            *.tar.gz
            SHA256SUMS.txt
          generate_release_notes: true
