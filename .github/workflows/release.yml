name: Build and Release Packages
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/test.yml
  build:
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned Go toolchain
        id: upstream
        run: |
          source packaging/upstream.env
          printf 'go_version=%s\n' "$SADP_GO_VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.upstream.outputs.go_version }}
          cache: false
      - name: Check release version
        run: |
          VERSION="$(cat VERSION)"
          test -f "docs/release-$VERSION.md"
          printf 'RELEASE_NOTES=docs/release-%s.md\n' "$VERSION" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "${GITHUB_REF#refs/tags/v}" = "$VERSION"
          fi
      - name: Build packages
        run: bash packaging/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: hikvision-sadp-packages
          path: |
            dist/*.deb
            dist/*.tar.gz
            dist/SHA256SUMS.txt
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          body_path: ${{ env.RELEASE_NOTES }}
